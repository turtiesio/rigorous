[package]
name = "rigor"
version = "0.1.0"
edition = "2021"
description = "A strictly typed, compositional foundation for modelling and governing systems"

[dependencies]
rigor-kernel = { path = "../kernel" }
rigor-logic = { path = "../logic" }
rigor-institution = { path = "../institution" }
rigor-adapter-host = { path = "../adapters/host" }
rigor-adapter-git = { path = "../adapters/git" }
rigor-adapter-chain = { path = "../adapters/chain" }
rigor-adapter-registry = { path = "../adapters/registry" }
rigor-adapter-forge = { path = "../adapters/forge" }
rigor-demo = { path = "../demo" }
rigor-steward = { path = "../steward" }
rigor-mind = { path = "../mind" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
bincode = "1"

[lints]
workspace = true
