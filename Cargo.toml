[workspace]
resolver = "2"
members = ["crates/rigor"]

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"
unused_results = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
as_conversions = "deny"
string_slice = "deny"
